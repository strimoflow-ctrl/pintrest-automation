<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>{{ item.seo_title }}</title>
  
  <!-- SEO OpenGraph for Social & Pinterest Crawlers -->
  <meta name="description" content="{{ item.seo_description }}">
  <meta property="og:title" content="{{ item.seo_title }}">
  <meta property="og:description" content="{{ item.seo_description }}">
  <meta property="og:image" content="{{ item.cdn_url or (site_url ~ '/media/' ~ item.file_path) }}">
  <meta property="og:type" content="article">
  <meta name="theme-color" content="#07090e">

  <link rel="stylesheet" href="/static/style.css">

  <!-- MONETAG OFFICIAL AD TAG -->
  <script src="https://quge5.com/88/tag.min.js" data-zone="305803" async data-cfasync="false"></script>

  {% if monetag_script_tag %}
    {{ monetag_script_tag | safe }}
  {% endif %}
</head>
<body class="single-view-body">

  <!-- Minimal Header -->
  <header class="navbar-compact">
    <a href="/" class="logo">
      <span>⚡</span> NOX <span class="logo-badge">PFP HUB</span>
    </a>
    <span class="badge-pill">💎 4K ULTRA HD</span>
  </header>

  <!-- Main Viewport (Zero Scroll, Fits 100% On Mobile Screen) -->
  <main class="compact-screen-container">
    
    <div class="compact-card">
      
      <!-- Media Preview Frame -->
      <div class="media-preview-box">
        {% if item.media_type == 'video' %}
          <video controls autoplay muted loop playsinline poster="{{ item.cdn_url }}">
            <source src="{{ item.cdn_url or ('/media/' ~ item.file_path) }}" type="video/mp4">
          </video>
        {% else %}
          <img src="{{ item.cdn_url or ('/media/' ~ item.file_path) }}" 
               alt="{{ item.seo_title }}" 
               loading="eager" 
               decoding="async">
        {% endif %}
      </div>

      <!-- Action Footer with Truncated Title & Direct Download -->
      <div class="compact-action-panel">
        
        <!-- Short Title with Ellipsis -->
        <div class="compact-title-row">
          <h1 class="compact-title" title="{{ item.seo_title }}">{{ item.seo_title }}</h1>
        </div>

        <!-- 9s Countdown Timer & Progress -->
        <div class="compact-timer-row" id="timerRow">
          <div class="timer-flex">
            <span class="timer-msg">⚡ Generating Direct Download Link...</span>
            <span class="timer-countdown-badge" id="countdown">{{ timer_seconds }}s</span>
          </div>
          <div class="compact-progress-track">
            <div class="compact-progress-fill" id="progressFill"></div>
          </div>
        </div>

        <!-- Download CTA Button (Dual Trigger) -->
        <button id="downloadBtn" class="compact-btn-cta btn-locked" disabled>
          ⏳ Please wait ({{ timer_seconds }}s)...
        </button>

      </div>

    </div>

  </main>

  <!-- Service Worker & Dual Download Scripts -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js', { scope: '/' })
        .catch(err => console.log('SW register info:', err));
    }

    const TOTAL_SECONDS = {{ timer_seconds }};
    let remaining = TOTAL_SECONDS;
    const countdownEl = document.getElementById('countdown');
    const progressFill = document.getElementById('progressFill');
    const downloadBtn = document.getElementById('downloadBtn');
    const timerRow = document.getElementById('timerRow');

    const DIRECT_AD_LINK = "{{ monetag_direct_link }}";
    const FILE_URL = "/download/{{ item.id }}";

    const countdownInterval = setInterval(() => {
      remaining--;
      
      if (remaining > 0) {
        countdownEl.innerText = remaining + 's';
        downloadBtn.innerText = '⏳ Generating Link (' + remaining + 's)...';
        const percent = ((TOTAL_SECONDS - remaining) / TOTAL_SECONDS) * 100;
        progressFill.style.width = percent + '%';
      } else {
        clearInterval(countdownInterval);
        progressFill.style.width = '100%';
        countdownEl.innerText = 'Ready!';
        countdownEl.style.color = '#10b981';
        
        // Transform button to active pulsing CTA
        downloadBtn.disabled = false;
        downloadBtn.className = 'compact-btn-cta btn-ready-pulse';
        downloadBtn.innerHTML = '⬇️ Download Ultra HD (Original File)';
      }
    }, 1000);

    downloadBtn.addEventListener('click', () => {
      if (downloadBtn.disabled) return;

      // 1. Open Monetag direct link in new tab
      if (DIRECT_AD_LINK && DIRECT_AD_LINK.startsWith("http")) {
        window.open(DIRECT_AD_LINK, '_blank');
      }

      // 2. Direct browser download of original image
      const a = document.createElement('a');
      a.href = FILE_URL;
      a.setAttribute('download', '{{ item.original_filename or "wallpaper.jpg" }}');
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      downloadBtn.innerHTML = '✅ Download Started!';
      setTimeout(() => {
        downloadBtn.innerHTML = '⬇️ Download Again (4K UHD)';
      }, 3500);
    });
  </script>

</body>
</html>
